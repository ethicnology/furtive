name: furtive
description: "Le terme s'applique à un comportement ou à un mouvement rapide et secret"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.3.0+3

environment:
  sdk: ^3.10.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # version pinned by flutter_localizations
  collection: ^1.19.1 # stable mergeSort, used directly by activity_entity.dart

  flutter_map: ^8.3.1
  flutter_map_location_marker: ^10.3.0
  # Two deliberate "no" decisions here, both re-verified 2026-07-26.
  #
  # 1. NOT 10.0.0-beta.2, despite the higher number:
  #    - 9.x is the actively maintained line. Upstream's `9.0.0` branch got
  #      commits on 2026-07-23; the `main` branch carrying 10.x has had no
  #      commit since 2025-10-19, and both 10.0.0 betas date from that same
  #      October 2025 burst.
  #    - upstream issue #271 ("Fill layers not rendering at zoom levels below
  #      source maxzoom (v10)") is an open v10-specific rendering defect,
  #      still unfixed 8 months on.
  #    - 10.x requires `vector_tile_renderer ^7.0.0-beta.1` (itself a beta,
  #      untouched since 2025-10-18), whereas 6.1.0 below is the current
  #      STABLE renderer — and we consume its API directly (next line), so a
  #      renderer major would break the hand-rolled style pipeline in
  #      map_remote_data_source.dart.
  #
  # 2. NOT 9.0.0-beta.10/11 either, even though they are newer. They raise the
  #    `latlong2` floor to ^0.10.1, which flutter_map_location_marker 10.3.0
  #    (its newest release) does not allow (^0.9.1) — an unsatisfiable
  #    conflict that can only be forced with a `dependency_overrides` entry.
  #    That override buys nothing: diffing the published beta.9 and beta.11
  #    archives shows the ONLY code changes are lint fixes with no runtime
  #    effect — `_renderJob(job)` -> `_renderJob(dynamic job)` and
  #    `_updateLabels(job)` -> `(dynamic job)` (an untyped Dart parameter is
  #    already `dynamic`), an added `bool` return type, and dropping a
  #    `library` directive. Upstream's "fix typecast error" commit reverts an
  #    over-tightened annotation introduced after beta.9 shipped; beta.9 never
  #    had the defect. So: no behavioural gain, real solver liability — stay.
  #    Revisit once flutter_map_location_marker#167 ("Bump latlong2 from 0.9.1
  #    to 0.10.1", open since 2026-07-01) lands, which removes the conflict
  #    without an override.
  vector_map_tiles: ^9.0.0-beta.9
  vector_tile_renderer: ^6.1.0 # transitive of vector_map_tiles, imported directly for ThemeReader / SpriteIndexReader. 6.1.0 is the latest stable (7.0.0-beta.1 is a stale beta, see above).
  executor_lib: ^1.1.2 # transitive of vector_map_tiles, imported directly to recognise its benign CancellationException
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0 # sequential()/droppable() transformers for MapBloc
  get_it: ^9.2.1
  latlong2: ^0.9.1 # capped by flutter_map_location_marker 10.3.0 (^0.9.1), not by vector_map_tiles — see the note on vector_map_tiles above. 0.10.x holds nothing we need (improved LatLng.hashCode, added LatLng.isValid).
  geolocator: ^14.0.2
  permission_handler: ^12.0.3
  http: ^1.6.0
  xml: ^7.0.1
  drift: ^2.34.2
  path_provider: ^2.1.6
  path: ^1.9.1
  dart_mappable: ^4.8.0
  logging_colorful: ^1.3.2
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  device_info_plus: ^13.2.0
  file_selector: ^1.1.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # ---------------------------------------------------------------------
  # THE ANALYZER-13 WALL — why the three codegen packages below are pinned
  # to older versions even though newer ones exist.
  #
  # Every newer release of build_runner (>=2.15.2), drift_dev (>2.34.0) and
  # dart_mappable_builder (>=4.9.0) requires analyzer ^13.0.0 (build_runner
  # additionally needs meta ^1.18.3). Flutter 3.44.8 ships Dart 3.12.2, which
  # caps analyzer at 12.1.0 and pins meta 1.18.0; flutter_test additionally
  # pins test_api 0.7.11 and matcher 0.12.19, so pulling analyzer 13 drags in
  # a `test` version that conflicts with bloc_test.
  #
  # These bumps resolve cleanly in a bare Dart project — they fail HERE
  # specifically because of the Flutter SDK's own pins. Nothing to fix on our
  # side: re-attempt all three together the first time a Flutter stable ships
  # analyzer >= 13 / meta >= 1.18.3.
  # ---------------------------------------------------------------------
  build_runner: ^2.15.1
  # Blocked by the analyzer-13 wall above — and this pin has a visible cost:
  # against drift 2.34.2, drift_dev 2.34.0's CLI does not compile, so
  # `dart run drift_dev schema <dump|export|generate|steps>` dies on
  # `allSchemaEntities` (removed from drift3_preview's GeneratedDatabase).
  # The whole schema-migration verification toolchain (SchemaVerifier,
  # step-by-step migration tests) is therefore unavailable. build_runner
  # codegen is unaffected, which is why it goes unnoticed day to day.
  # Until the wall lifts, migrations are covered only by the hand-written
  # tests in test/database_test.dart.
  drift_dev: ^2.34.0
  sqlite3: ^3.5.0 # already a drift transitive; declared for the migration test
  # Both are already path_provider transitives; declared explicitly because
  # test/file_system_facade_test.dart imports them directly to substitute a fake
  # temp directory, which is what makes the location-bearing-temp-file purge
  # testable at all.
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  bloc_test: ^10.0.0
  dart_mappable_builder: ^4.8.0 # blocked by the analyzer-13 wall above
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 24 # android min sdk min:16, default 21
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/logo.png"

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Wires `flutter gen-l10n` (configured in l10n.yaml) into the build —
  # the generated AppLocalizations is reachable as
  # `package:flutter_gen/gen_l10n/app_localizations.dart`.
  generate: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  assets:
    - assets/logo.png

  # Space Grotesk (SIL OFL 1.1, assets/fonts/SpaceGrotesk-OFL.txt), bundled
  # locally as a variable font — no runtime fetching, unlike the
  # `google_fonts` package, which would download glyphs over the network on
  # first use and conflicts with this app's "no network calls beyond what
  # you can see in the source" stance. One variable-font file covers every
  # weight the theme uses (400/500/700); Flutter/Skia selects the weight via
  # the font's wght axis, so every `weight:` entry below points at the same
  # file.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 700
