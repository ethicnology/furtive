name: CI

on:
  # Run on every push to every branch, not just main — otherwise work on a
  # long-lived feature/release branch (like this one) only gets checked once
  # a PR is opened, instead of on each push while it's still being iterated
  # on. `pull_request` is kept for the (rare) case of a PR from a fork,
  # where `push` wouldn't have repo permissions to report a status anyway.
  push:
  pull_request:

jobs:
  check:
    # Pinned to 24.04 for consistency with build-android.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Read Flutter version from .fvmrc
        id: fvmrc
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.fvmrc.outputs.version }}
          channel: stable
          cache: true

      - name: pub get (enforce lockfile)
        run: flutter pub get --enforce-lockfile

      - name: viewer pub get (enforce lockfile)
        run: dart pub get --directory viewer --enforce-lockfile

      - name: shared package pub get (enforce lockfile)
        run: dart pub get --directory packages/furtive_share --enforce-lockfile

      # dart_mappable (*mapper.dart) and drift (*.g.dart) generated sources
      # are gitignored — analyze/test can't resolve without them.
      - name: build_runner (generate *.g.dart / *mapper.dart)
        run: dart run build_runner build --delete-conflicting-outputs --force-jit

      - name: Generate localizations + check ARB parity
        run: |
          flutter gen-l10n
          python3 -c "import json, os, sys; \
          d = 'lib/l10n'; \
          arbs = {f[4:-4]: {k for k in json.load(open(os.path.join(d,f))).keys() if not k.startswith('@')} \
                  for f in sorted(os.listdir(d)) if f.startswith('app_') and f.endswith('.arb')}; \
          en = arbs['en']; \
          bad = [(loc, sorted(en - keys), sorted(keys - en)) for loc, keys in arbs.items() if loc != 'en' and (en - keys or keys - en)]; \
          print(f'  {len(arbs)} locales, {len(en)} keys each'); \
          sys.exit(0) if not bad else (print('PARITY ISSUES:'), [print(f'  {loc}: missing={m} extra={e}') for loc,m,e in bad], sys.exit(1))"

      - name: dart format --set-exit-if-changed
        run: dart format --set-exit-if-changed lib test packages/furtive_share/lib packages/furtive_share/test viewer/lib viewer/test viewer/web

      - name: flutter analyze
        run: flutter analyze

      - name: Analyze shared package and web viewer
        run: |
          dart analyze packages/furtive_share
          dart analyze viewer

      - name: Compile web viewer
        run: |
          mkdir -p build/viewer
          dart compile js -O4 -o build/viewer/main.dart.js viewer/web/main.dart
          python3 tool/package_viewer.py build/viewer

      # Fails on an import that would drag Flutter, storage, or sensors into the
      # pure-Dart package shared with the web viewer.
      - name: Share-layer boundary
        run: python3 tool/check_share_boundary.py

      # --coverage rather than a bare `flutter test`: the threshold check below
      # is what stops the suite from silently rotting. Without a measured floor
      # in CI, coverage only ever moves in one direction.
      - name: flutter test (with coverage)
        run: flutter test --coverage

      - name: Shared package tests
        working-directory: packages/furtive_share
        run: dart test

      - name: Viewer logic tests
        working-directory: viewer
        run: dart test

      - name: Coverage floor
        run: python3 tool/coverage_threshold.py --report

      # Analyze/test cannot compile Kotlin, merge the Android manifest, resolve
      # MapLibre Native, or exercise release-only Gradle configuration.
      - name: Compile release APK
        run: flutter build apk --release
