org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier rewrites legacy com.android.support references to AndroidX. Every
# dependency in this project is AndroidX-native (verified: no support-library
# artefact in the resolved graph), so this only cost build time.
android.enableJetifier=false

# Android SDK versions (single source of truth for build.gradle.kts and
# Containerfile.tools).
#
# NO INLINE COMMENTS on the lines below: the makefile feeds them to the
# container build with `grep ... | cut -d= -f2`, so anything after the `=` —
# including a trailing `# comment` — is passed verbatim to sdkmanager/Gradle and
# breaks the build. Put explanations above the line, as here.
android.minSdk=24
android.compileSdk=36
android.targetSdk=36
# Deliberately behind compileSdk/targetSdk (36): 34.0.0 is what every shipped
# release was built and verified reproducible with, AGP is satisfied by it, and
# bumping it would invalidate that verification for no functional gain. Revisit
# only alongside a fresh `make verify-reproducible` run.
android.buildToolsVersion=34.0.0
android.ndkVersion=29.0.14206865
android.jvmTarget=21
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
